name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zip gettext

      - name: Build .plasmoid package
        run: make package

      - name: Attach package to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ocx-plasma-*.plasmoid
